<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">Seven lenses on what is evaluated in AI UX discourse</title>
<desc id="map-desc">Concept map with five primary discourse lenses, an explicitly marked adjacent-scholarship extension concerning situated cultural systems, and a distinct secondary conversation about AI use in research labour and simulated evidence. Meaningfully labelled connectors compare outcomes with variation, initiative with authority, and contribution with uptake. The centre asks what is being evaluated, whose purpose is served, what evidence is available, and what happens next. All connections are interpretive synthesis, not causal or frequency claims.</desc>
